<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account activation — Axia Bank</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#050806; color:#f4f4f4; margin:0; }
    a { color:#8fd4a8; text-decoration:none; }
    .page { max-width:720px; margin:48px auto; background:#0a0f0c; border:1px solid #1a2e24; border-radius:24px; padding:36px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; color:#fff; margin-bottom:24px; }
    .brand img { width:42px; height:42px; object-fit:contain; background:#fff; border-radius:8px; padding:3px; }
    .spin { width:72px; height:72px; border:6px solid #1f3329; border-top-color:#8fd4a8; border-radius:50%; animation:turn 1s linear infinite; margin:12px 0 20px; }
    @keyframes turn { to { transform: rotate(360deg); } }
    h1 { font-size:28px; margin:0 0 10px; color:#8fd4a8; }
    p { color:#9aa79f; line-height:1.5; }
    .btn { display:inline-block; margin-top:22px; background:#0b3d2a; color:#fff; padding:12px 22px; border-radius:999px; font-weight:700; }
  </style>
</head>
<body>
  <div class="page">
    <a class="brand" href="index.html"><img src="logo.png" alt=""> Axia Bank</a>
    <div class="spin"></div>
    <h1>Account activation in progress</h1>
    <p>Please wait while admin reviews your application and ID. You cannot open the dashboard yet.</p>
    <p>When admin opens the account, Axia sends the account-created email. Then use Login and your PIN.</p>
    <a class="btn" href="login.html">Go to Login</a>
  </div>
</body>
</html>
