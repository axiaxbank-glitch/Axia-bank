<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New password — Axia Bank</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#050806; color:#f4f4f4; margin:0; }
    a { color:#8fd4a8; }
    .page { max-width:520px; margin:48px auto; background:#0a0f0c; border:1px solid #1a2e24; border-radius:24px; padding:36px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; text-decoration:none; color:#fff; margin-bottom:24px; }
    .brand img { width:42px; height:42px; object-fit:contain; background:#fff; border-radius:8px; padding:3px; }
    h1 { font-size:28px; margin:0 0 8px; }
    .sub { color:#9aa79f; margin-bottom:22px; }
    label { display:block; font-size:14px; font-weight:600; margin:14px 0 8px; }
    input { width:100%; padding:12px 14px; border:1px solid #1f3329; border-radius:14px; font-size:15px; background:#07140f; color:#fff; box-sizing:border-box; }
    .btn { width:100%; margin-top:18px; background:#0b3d2a; color:#fff; border:0; padding:14px; border-radius:999px; font-size:15px; font-weight:700; cursor:pointer; }
    .err { color:#ffb4b4; min-height:18px; margin-top:10px; font-size:13px; }
  </style>
</head>
<body>
  <div class="page">
    <a class="brand" href="index.html"><img src="logo.png" alt=""> Axia Bank</a>
    
    <h1>Create a new password</h1>
    <p class="sub">Enter the new password twice. They must match.</p>
    <form id="f">
      <label>New password</label>
      <input id="p1" type="password" required>
      <label>Repeat password</label>
      <input id="p2" type="password" required>
      <p class="err" id="err"></p>
      <button class="btn" type="submit">Save password</button>
    </form>

  </div>
  <script>
  
    if (!localStorage.getItem("axia_reset_ok")) location.href = "app-forgot.html";
    document.getElementById("f").onsubmit = function (e) {
      e.preventDefault();
      var p1 = document.getElementById("p1").value;
      var p2 = document.getElementById("p2").value;
      var err = document.getElementById("err");
      if (p1.length < 8) { err.textContent = "Password must be 8+ characters"; return; }
      if (p1 !== p2) { err.textContent = "Passwords do not match"; return; }
      fetch("/api/auth/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: localStorage.getItem("axia_reset_email"),
          code: localStorage.getItem("axia_reset_code"),
          password: p1,
          password_confirm: p2
        })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.error) { err.textContent = d.error; return; }
        localStorage.removeItem("axia_reset_ok");
        localStorage.removeItem("axia_reset_code");
        localStorage.removeItem("axia_reset_email");
        location.href = "app-forgot-done.html";
      }).catch(function () { err.textContent = "Server not running"; });
    };

  </script>
</body>
</html>
