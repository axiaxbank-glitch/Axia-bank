<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter PIN — Axia Bank</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#050806; color:#f4f4f4; margin:0; }
    a { color:#8fd4a8; }
    .page { max-width:420px; margin:60px auto; background:#0a0f0c; border:1px solid #1a2e24; border-radius:24px; padding:36px; text-align:center; }
    .brand { display:flex; align-items:center; justify-content:center; gap:10px; font-weight:700; font-size:20px; text-decoration:none; color:#fff; margin-bottom:24px; }
    .brand img { width:42px; height:42px; object-fit:contain; background:#fff; border-radius:8px; padding:3px; }
    .pic, .ph { width:84px; height:84px; border-radius:50%; margin:0 auto 12px; object-fit:cover; background:#0b3d2a; color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; }
    h1 { font-size:24px; margin:0 0 8px; }
    .sub { color:#9aa79f; margin-bottom:22px; }
    input { width:100%; padding:14px; border:1px solid #1f3329; border-radius:14px; font-size:22px; letter-spacing:8px; text-align:center; background:#07140f; color:#fff; box-sizing:border-box; }
    .btn { width:100%; margin-top:18px; background:#0b3d2a; color:#fff; border:0; padding:14px; border-radius:999px; font-size:15px; font-weight:700; cursor:pointer; }
    .err { color:#ffb4b4; min-height:18px; margin-top:10px; font-size:13px; }
  </style>
</head>
<body>
  <div class="page">
    <a class="brand" href="index.html"><img src="logo.png" alt=""> Axia Bank</a>
    <img id="pic" class="pic" alt="" style="display:none">
    <div class="ph" id="ph">A</div>
    <h1 id="hello">Enter your PIN</h1>
    <p class="sub">Use the PIN you created during registration.</p>
    <form id="f">
      <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" required>
      <p class="err" id="err"></p>
      <button class="btn" type="submit">Unlock</button>
    </form>
    <p style="margin-top:18px"><a href="login.html">Back to login</a></p>
  </div>
  <script>
    var pre = localStorage.getItem("axia_pre_token") || "";
    var info = {};
    try { info = JSON.parse(localStorage.getItem("axia_pin_user") || "{}"); } catch (e) {}
    var name = info.first_name || info.username || "there";
    document.getElementById("hello").textContent = "Hi " + name;
    if (info.profile_pic) {
      document.getElementById("pic").src = info.profile_pic;
      document.getElementById("pic").style.display = "block";
      document.getElementById("ph").style.display = "none";
    } else {
      document.getElementById("ph").textContent = String(name).charAt(0).toUpperCase();
    }
    if (!pre) document.getElementById("err").textContent = "Sign in with your password first";
    document.getElementById("f").onsubmit = function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      fetch("/api/auth/pin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pre_token: pre, pin: document.getElementById("pin").value })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.error) { err.textContent = d.error; return; }
        localStorage.setItem("axia_customer_token", d.token);
        localStorage.setItem("axia_session", JSON.stringify({
          firstName: (d.customer && d.customer.first_name) || info.first_name || "",
          lastName: (d.customer && d.customer.last_name) || info.last_name || "",
          email: (d.customer && d.customer.email) || "",
          username: (d.customer && d.customer.username) || info.username || "",
          profilePic: (d.customer && d.customer.profile_pic) || info.profile_pic || ""
        }));
        location.href = "dashboard.html";
      }).catch(function () {
        err.textContent = "Open http://localhost:3000/app-pin.html after starting the server";
      });
    };
  </script>
</body>
</html>
