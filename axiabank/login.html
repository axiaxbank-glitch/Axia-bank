<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Axia Bank</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #050806; color: #f4f4f4; }
    a { color: #8fd4a8; }
    .page { max-width: 1180px; margin: 24px auto; background: #0a0f0c; border-radius: 28px; overflow: hidden; border: 1px solid #1a2e24; }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; text-decoration: none; color: #fff; }
    .brand img { width: 42px; height: 42px; object-fit: contain; border-radius: 8px; background: #fff; padding: 3px; }
    .nav-links { display: flex; gap: 6px; background: #07140f; border-radius: 999px; padding: 6px; }
    .nav-links a { padding: 8px 16px; border-radius: 999px; font-size: 14px; color: #d7e4dc; text-decoration: none; font-weight: 500; }
    .nav-links a.on { background: #0b3d2a; color: #fff; font-weight: 700; }
    .btn-light { border: 1px solid #1f3329; background: #0b3d2a; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; color: #fff; }
    .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 20px 48px 48px; align-items: center; }
    h1 { font-size: 32px; margin: 0 0 24px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 8px; }
    .input-box { display: flex; align-items: center; border: 1px solid #1f3329; border-radius: 14px; padding: 12px 14px; background: #07140f; }
    .input-box input { border: none; outline: none; width: 100%; font-size: 15px; font-family: inherit; background: transparent; color: #fff; }
    .input-box button { border: none; background: none; color: #8fd4a8; cursor: pointer; }
    .btn-dark { width: 100%; margin-top: 18px; background: #0b3d2a; color: #fff; border: 0; padding: 16px; border-radius: 999px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .art { min-height: 380px; position: relative; }
    .card { position: absolute; width: 170px; height: 260px; border-radius: 20px; box-shadow: 0 22px 40px rgba(0,0,0,.45); padding: 16px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
    .chip { width: 34px; height: 24px; border-radius: 6px; background: linear-gradient(135deg,#f3e3a0,#c9a227); }
    .one { left: 16px; top: 80px; background: linear-gradient(160deg,#8d8d8d,#d9d9d9); color: #222; transform: rotate(-16deg); }
    .two { left: 88px; top: 40px; background: linear-gradient(160deg,#8a6a22,#e4c56a); color: #2a1d08; transform: rotate(-4deg); }
    .three { right: 16px; top: 64px; background: linear-gradient(160deg,#03160e,#0b3d2a 55%,#020806); transform: rotate(12deg); }
    #err { color: #ffb4b4; min-height: 18px; margin-top: 10px; }
    .signup { margin-top: 18px; }
    @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } .nav-links { display: none; } .art { min-height: 300px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="nav">
      <a class="brand" href="index.html"><img src="logo.png" alt="Axia"> Axia Bank</a>
      <nav class="nav-links">
        <a href="index.html">Banking</a>
        <a href="registration.html">Customers</a>
        <a href="admin-index.html">Partners</a>
      </nav>
      <a class="btn-light" href="registration.html">Create account</a>
    </header>
    <section class="wrap">
      <div>
        <h1>Log in to your Axia Account</h1>
        <form id="loginForm">
          <label>Email or username</label>
          <div class="input-box"><input id="email" type="text" placeholder="Email or username" required></div>
          <label>Password</label>
          <div class="input-box">
            <input id="password" type="password" placeholder="Password" required>
            <button type="button" id="togglePass">show</button>
          </div>
          <p id="err"></p>
          <button class="btn-dark" type="submit">Secure Log In</button>
        </form>
        <p class="signup"><a href="app-forgot.html">Forgot Password?</a></p>
        <p class="signup">New here? <a href="registration.html">Sign up for a free account</a></p>
      </div>
      <div class="art">
        <div class="card one"><div class="chip"></div><div>AXIA<br><small>SILVER</small></div></div>
        <div class="card two"><div class="chip"></div><div>AXIA<br><small>GOLD</small></div></div>
        <div class="card three"><div class="chip"></div><div>AXIA<br><small>BLACK</small></div></div>
      </div>
    </section>
  </div>
  <script>
    document.getElementById("togglePass").onclick = function () {
      var p = document.getElementById("password");
      p.type = p.type === "password" ? "text" : "password";
      this.textContent = p.type === "password" ? "show" : "hide";
    };
    document.getElementById("loginForm").onsubmit = function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.error) {
          err.textContent = d.error;
          if (String(d.error).toLowerCase().indexOf("waiting") !== -1) {
            setTimeout(function () { location.href = "app-pending.html"; }, 700);
          }
          return;
        }
        if (d.role === "admin") {
          localStorage.setItem("axia_admin_token", d.token);
          location.href = "admin-app.html";
          return;
        }
        localStorage.setItem("axia_pre_token", d.pre_token);
        localStorage.setItem("axia_pin_user", JSON.stringify(d.customer || {}));
        location.href = "app-pin.html";
      }).catch(function () {
        err.textContent = "Open http://localhost:3000/login.html after starting the server";
      });
    };
  </script>
</body>
</html>
