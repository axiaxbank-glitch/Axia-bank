<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Axia Bank</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/axia-mail.js"></script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#050806; color:#f4f4f4; margin:0; }
    a { color:#8fd4a8; }
    .page { max-width:520px; margin:48px auto; background:#0a0f0c; border:1px solid #1a2e24; border-radius:24px; padding:36px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; text-decoration:none; color:#fff; margin-bottom:24px; }
    .brand img { width:42px; height:42px; object-fit:contain; background:#fff; border-radius:8px; padding:3px; }
    h1 { font-size:28px; margin:0 0 8px; }
    .sub { color:#9aa79f; margin-bottom:22px; }
    label { display:block; font-size:14px; font-weight:600; margin:14px 0 8px; }
    input { width:100%; padding:12px 14px; border:1px solid #1f3329; border-radius:14px; font-size:15px; background:#07140f; color:#fff; box-sizing:border-box; }
    .btn { width:100%; margin-top:18px; background:#0b3d2a; color:#fff; border:0; padding:14px; border-radius:999px; font-size:15px; font-weight:700; cursor:pointer; }
    .err { color:#ffb4b4; min-height:18px; margin-top:10px; font-size:13px; }
  </style>
</head>
<body>
  <div class="page">
    <a class="brand" href="index.html"><img src="logo.png" alt=""> Axia Bank</a>
    
    <h1>Forgot password</h1>
    <p class="sub">Enter the email or username on the account. A 6-digit code will be created next.</p>
    <form id="f">
      <label>Email or username</label>
      <input id="email" type="text" placeholder="Email or username" required>
      <p class="err" id="err"></p>
      <button class="btn" type="submit">Send code</button>
    </form>
    <p style="margin-top:18px"><a href="login.html">Back to login</a></p>

  </div>
  <script>
  
    document.getElementById("f").onsubmit = function (e) {
      e.preventDefault();
      var email = document.getElementById("email").value.trim();
      var err = document.getElementById("err");
      err.textContent = "Sending…";
      fetch("/api/auth/forgot", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.error) { err.textContent = d.error; return; }
        localStorage.setItem("axia_reset_email", d.email || email);
        if (d.code) localStorage.setItem("axia_reset_code", d.code);
        var go = function () { location.href = "app-forgot-code.html"; };
        if (window.axiaSendMail && d.code) {
          axiaSendMail("reset", {
            to_email: d.email || email,
            email: d.email || email,
            name: "Customer",
            code: d.code,
            passcode: d.code,
            reset_code: d.code,
            date: new Date().toLocaleString(),
            purpose: "Password reset",
            message: "Your Axia reset code is " + d.code
          }).then(go).catch(go);
        } else go();
      }).catch(function () {
        err.textContent = "Open http://localhost:3000/app-forgot.html after starting the server";
      });
    };

  </script>
</body>
</html>
